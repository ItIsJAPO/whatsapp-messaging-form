<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Sender Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
    </style>
</head>
<body>

<div class="card shadow" style="max-width: 450px; width: 100%;">
    <div class="card-body p-4 p-md-5">

        <h1 class="card-title text-center mb-4">
            Send WhatsApp Message
        </h1>

        <form id="whatsapp-form">

            <div class="mb-3">
                <label for="phone" class="form-label">
                    Phone Number (including country code):
                </label>
                <input
                        type="tel"
                        class="form-control"
                        id="phone"
                        required
                        value="52"
                >
            </div>

            <div class="mb-4">
                <label for="message" class="form-label">
                    Message (optional):
                </label>
                <textarea
                        class="form-control"
                        id="message"
                        rows="3"
                        placeholder="Type your message here optional..."
                ></textarea>
            </div>

            <button
                    type="submit"
                    class="btn btn-success btn-lg w-100"
            >
                Open WhatsApp
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const phoneInput = document.getElementById('phone');
    const whatsappForm = document.getElementById('whatsapp-form');
    const messageInput = document.getElementById('message');

    function cleanPhoneNumber(rawNumber) {
        return rawNumber.replace(/[^0-9+]/g, '');
    }

    phoneInput.addEventListener('input', function () {
        const rawValue = this.value;
        const cleanedValue = cleanPhoneNumber(rawValue);

        if (this.value !== cleanedValue) {
            this.value = cleanedValue;
        }
    });

    whatsappForm.addEventListener('submit', function (e) {
        e.preventDefault();

        const numero = encodeURIComponent(phoneInput.value.trim());
        const mensaje = encodeURIComponent(messageInput.value.trim());

        if (!numero) {
            alert("Por favor, introduce un número de teléfono válido.");
            return;
        }

        const enlace = `https://api.whatsapp.com/send?phone=${numero}&text=${mensaje}`;
        window.open(enlace, '_blank');
    });
</script>
</body>
</html>
